services:
  app:
    build:
      context: .
    image: delivery-eta:0.1
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
    init: true
    ports:
      - "127.0.0.1:8501:8501"

  jupyter:
    build:
      context: .
    image: delivery-eta:0.1
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
    init: true
    ports:
      - "127.0.0.1:8889:8888"
    command:
      - python
      - -m
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --IdentityProvider.token=deliveryeta-local
